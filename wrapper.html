<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CamView App</title>

    <!-- Bootstrap Pack -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- External Libraries -->
    <script src="https://code.highcharts.com/stock/highstock.js"></script>
    <script src="https://code.highcharts.com/modules/boost.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <!-- Source JS -->
    <script type="module" src="/src/main.js"></script>
</head>

<body>
    <div id="root" style="width: 100vw; height: 100vh;"></div>
</body>
<script>

    const root = document.getElementById('root');
    const configTemplate = {
        camID: 'camID',
        time: {
            // startUTC:       "2026-01-01T14:00:00Z",
            // endUTC:         "2026-01-20T23:00:00Z",
            // initialTimeUTC: "2026-01-20T12:00:00Z",
        },
        settings: {
            collapse: true,
            color: {
                active: true,
                type: 'line',
                opacity: 0.8,
                levels: 8,
                minLevel: 25,
                maxLevel: 120,
            }
        },
        chart: {
            useUTC: false,
            defaultSeries: {
                x: 0.5,
                y: 0.5
            }
        },
        debug: false,
    };

    // Podemos invocar CamView(container, config) en un comtexto async

    const camaras = [
        {
            camID: 'CAM_FUCH_01',
            humanID: 'Fundición Chiqucamata',
            chart: {
                useUTC: false,
                defaultSeries: {
                    x: 0.4,
                    y: 0.73
                }
            },
        },
        {
            camID: 'NIMCAM',
            humanID: 'Rajo de Pelaembres',
            chart: {
                useUTC: true,
            },
        },
        {
            camID: 'CAM_E04',
            humanID: 'Estanque Los Bronces',
            chart: {
                useUTC: false,
            },
        }

    ];

    /*------------------------------------------------------
      Inicializar la interfaz de selección de cámara
    ------------------------------------------------------*/
    async function runApp() {
        root.style.display = 'block';
        root.style.overflow = 'auto';

        // Header
        const header = document.createElement("header");
        header.classList.add("bg-gradient", "shadow-sm");
        header.style.padding = "0.25rem 0";
        header.innerHTML = `
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-camera-video-fill" style="font-size: 1.5rem;"></i>
                        <div style="line-height: 1.2;">
                            <h1 class="mb-0" style="font-size: 1rem; font-weight: 600;">
                                DustCam
                            </h1>
                            <small style="font-size:10px;" class="opacity-75">Sistema de detección y monitoreo de polvo</small>
                        </div>
                    </div>
                </div>
            </div>
        `;
        root.appendChild(header);

        // Main
        const main = document.createElement("main");
        main.classList.add("container", "py-2");
        root.appendChild(main);

        // Alerta
        const alertInfo = document.createElement("div");
        alertInfo.classList.add("d-flex", "align-items-center");
        alertInfo.innerHTML = `
            <div class="mb-2 p-2">
                Seleccione una cámara de la lista para iniciar la aplicación.
            </div>
        `;
        main.appendChild(alertInfo);

        // Contenedor de tarjetas
        const cardContainer = document.createElement("div");
        cardContainer.classList.add("row", "row-cols-1", "row-cols-md-2", "row-cols-lg-3", "g-4", "mb-4");
        main.appendChild(cardContainer);

        // Variable para trackear tarjeta seleccionada (solo una)
        let selectedCard = null;
        let selectedCamera = null;

        camaras.forEach((camara, index) => {
            const colDiv = document.createElement("div");
            colDiv.classList.add("col");

            const card = document.createElement("div");
            card.style.userSelect = "none";
            card.classList.add("card", "h-100", "shadow-sm", "border-2");
            card.style.cursor = "pointer";
            card.style.transition = "all 0.3s ease";
            card.dataset.camera = camara.camID;

            card.innerHTML = `
                <div class="card-body text-center py-4">
                    <div class="mb-1">
                        <i class="bi bi-camera-video-fill text-primary" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="card-title fw-bold mb-2">${camara.humanID}</h5>
                </div>
            `;

            // Seleccion al hacer clic en la tarjeta
            card.addEventListener("click", () => {
                // Deseleccionar la tarjeta anterior si existe
                if (selectedCard && selectedCard !== card) {
                    selectedCard.classList.remove("border-primary", "border-3", "bg-primary", "bg-opacity-10");
                    selectedCard.classList.add("border-2");
                }

                // Seleccionar la nueva tarjeta
                selectedCard = card;
                selectedCamera = camara;
                card.classList.remove("border-3");
                card.classList.add("border-primary", "bg-primary", "bg-opacity-10");
            });

            colDiv.appendChild(card);
            cardContainer.appendChild(colDiv);
        });

        // Seccion de control
        const controlSection = document.createElement("div");
        controlSection.classList.add("card", "border-0");
        controlSection.innerHTML = `
            <div class="card-body p-2">
                <button id="start-app-btn" class="btn btn-primary fw-semibold">
                    <i class="bi bi-play-fill me-2"></i>
                    INICIAR APLICACIÓN
                </button>
            </div>
        `;
        main.appendChild(controlSection);

        const startAppBtn = document.getElementById("start-app-btn");
        startAppBtn.addEventListener("click", async () => {
            if (!selectedCamera) {
                // Alert de error con Bootstrap
                const errorAlert = document.createElement("div");
                errorAlert.classList.add("alert", "alert-info", "alert-dismissible", "fade", "show", "mt-3");
                errorAlert.innerHTML = `
                    Por favor, seleccione una cámara para iniciar la aplicación.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                controlSection.after(errorAlert);

                // Auto-cerrar después de 1.3 segundos
                setTimeout(() => errorAlert.remove(), 1300);
                return;
            }

            // Mostrar spinner de carga
            startAppBtn.disabled = true;

            // Limpiar solo el contenido principal, mantener el header
            main.innerHTML = "";
            main.classList.remove("container", "py-2"); // Para usar todo el ancho sobre el widget

            // Crear contenedor para CamView
            const CamViewContainer = document.createElement("div");
            CamViewContainer.classList.add("container-fluid");
            CamViewContainer.id = `cam-view-${selectedCamera.camID}`;
            main.appendChild(CamViewContainer);

            // Aplicar alto al resto de pantalla despues del header
            const headerHeight = header.offsetHeight;
            CamViewContainer.style.height = `calc(99vh - ${headerHeight}px)`;
            CamViewContainer.style.overflow = "auto";

            // Agregar al header el nombre la camara y el boton de volver
            header.querySelector("h1").textContent = `DustCam - ${selectedCamera.humanID}`;
            const backBtn = document.createElement("button");
            backBtn.style.fontSize = "0.7rem";
            backBtn.classList.add("btn", "btn-outline-secondary");
            backBtn.innerHTML = `<i class="bi bi-arrow-left"></i> Volver`;
            backBtn.addEventListener("click", () => {
                // Hacemos reinicio simple
                window.location.reload();
            });
            header.querySelector(".d-flex.justify-content-between").appendChild(backBtn);

            // Ejecutamos el widget CamView con la camara seleccionada
            const config = { ...configTemplate, ...selectedCamera };
            CamView(CamViewContainer.id, config);
        });
    }

    runApp();
</script>

</html>

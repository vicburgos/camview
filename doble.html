<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CamView App</title>

  <!-- Bootstrap Pack -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- External Libraries -->
  <script src="https://code.highcharts.com/stock/highstock.js"></script>
  <script src="https://code.highcharts.com/modules/boost.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <!-- Source JS -->
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <div id="cam-view" style="
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        width: 100vw;
        height: 100vh;
      ">
      
      <div id="CAM_FUCH_01" style="width:50%"></div>
      <div id="CAM_E04" style="width:50%"></div>
      <!-- <div id="NIMCAM" style="width:50%"></div>
      <div id="CAM_E04_2" style="width:50%"></div> -->
    </div>
</body>
  <script>
    const config = {
      camID: 'idcam',
      // camID: 'CAM_E04',
      // camID: 'NIMCAM',
      time: {
        // startUTC:       "2026-01-01T14:00:00Z",
        // endUTC:         "2026-01-20T23:00:00Z",
        // initialTimeUTC: "2026-01-20T12:00:00Z",
      },
      settings: {
        collapse: true,
        color: {
          active: true,
          type: 'line',
          opacity: 0.8,
          levels: 8,
          minLevel: 25,
          maxLevel: 120,
        }
      },
      chart: {
        useUTC: false,
        defaultSeries: {
          x: 0.4,
          y: 0.73
        }
      },
      debug: false,
    };
    // Inicialize the CamView when the DOM is ready
    async function run () {
      await CamView('CAM_FUCH_01', { ...config, camID: 'CAM_FUCH_01' });
      await CamView('CAM_E04', { ...config, camID: 'CAM_E04' });
      // await CamView('NIMCAM', { ...config, camID: 'NIMCAM' });
      // await CamView('CAM_E04_2', { ...config, camID: 'CAM_E04' });
    };
    document.addEventListener('DOMContentLoaded', run);

  </script>
</html>
